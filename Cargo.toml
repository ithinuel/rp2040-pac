# Keep these sorted by name
[dependencies]
cortex-m = "0.7.3"
cortex-m-rt = {version = ">=0.6.15,<0.8", optional = true}
critical-section = {optional = true, version = "1.0.0"}
defmt = {version = "0.3.10", optional = true}
vcell = "0.1.3"

[features]
rt = ["cortex-m-rt", "cortex-m-rt/device"]
defmt = ["dep:defmt"]

[package]
name = "rp2040-pac"
version = "0.7.0"
authors = ["The RP-RS team"]
edition = "2021"
homepage = "https://github.com/rp-rs/rp2040-pac"
description = "A Peripheral Access Crate for the Raspberry Pi RP2040 SoC"
license = "BSD-3-Clause"
repository = "https://github.com/rp-rs/rp2040-pac"

[package.metadata.cargo-udeps.ignore]
normal = ["cortex-m-rt"]

[package.metadata.docs.rs]
features = ["rt"]
targets = ["thumbv6m-none-eabi"]
